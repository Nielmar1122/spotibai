<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotibai — Bisaya Music</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="brand d-flex align-items-center">
  <img src="/images/logo.png" alt="Logo" style="width: 35px; height: 35px; border-radius: 50%; margin-right: 10px; object-fit: cover;">
  Spotibai
</div>
  <nav class="nav flex-column">
    <a class="nav-link active" data-view="home"><i class="bi bi-house-door"></i> Home</a>
    <a class="nav-link" data-view="search"><i class="bi bi-search"></i> Search</a>
    <a class="nav-link" data-view="songs"><i class="bi bi-music-note-list"></i> Songs</a>
    <a class="nav-link" data-view="artists"><i class="bi bi-people"></i> Artists</a>
    <a class="nav-link" data-view="albums"><i class="bi bi-collection"></i> Albums</a>
    <a class="nav-link" data-view="playlists"><i class="bi bi-file-earmark-music"></i> Playlists</a>
    <a class="nav-link" data-view="favorites"><i class="bi bi-heart"></i> Favorites</a>
    <a class="nav-link" data-view="recent"><i class="bi bi-clock-history"></i> Recently Played</a>
    <a class="nav-link" data-view="profile"><i class="bi bi-person-circle"></i> Profile</a>
    <a class="nav-link" data-view="admin"><i class="bi bi-cloud-arrow-up"></i> Admin Upload</a>
  </nav>
</aside>

<main class="main-content">
  <header class="topbar">
    <button class="btn btn-dark d-md-none" id="menuToggle"><i class="bi bi-list"></i></button>
    <div class="search-wrap position-relative">
      <input id="globalSearch" class="form-control search-input" placeholder="Search Bisaya songs, artists, albums…">
      <div id="easterEgg" class="easter-egg"></div>
    </div>
    <div class="auth-area" id="authArea">
      <a class="btn btn-outline-light btn-sm me-2" href="#" data-action="login">Login</a>
      <a class="btn btn-success btn-sm" href="#" data-action="register">Sign Up</a>
    </div>
  </header>

  <div id="view"></div>
</main>

<!-- Fixed Player -->
<div class="player" id="player">
  <div class="player-left">
    <img id="playerCover" src="/images/default-cover.png" alt="">
    <div>
      <div id="playerTitle" class="player-title">No song playing</div>
      <div id="playerArtist" class="player-artist">—</div>
    </div>
  </div>
  <div class="player-center">
    <div class="player-controls">
      <button class="btn-icon" id="btnShuffle"><i class="bi bi-shuffle"></i></button>
      <button class="btn-icon" id="btnPrev"><i class="bi bi-skip-start-fill"></i></button>
      <button class="btn-play" id="btnPlay"><i class="bi bi-play-fill"></i></button>
      <button class="btn-icon" id="btnNext"><i class="bi bi-skip-end-fill"></i></button>
      <button class="btn-icon" id="btnRepeat"><i class="bi bi-repeat"></i></button>
    </div>
    <div class="progress-row">
      <span id="curTime">0:00</span>
      <input type="range" id="progress" min="0" max="100" value="0">
      <span id="durTime">0:00</span>
    </div>
  </div>
  <div class="player-right">
    <button class="btn-icon" id="btnFav"><i class="bi bi-heart"></i></button>
    <i class="bi bi-volume-down"></i>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
  </div>
  <audio id="audio"></audio>
</div>
<!-- AD POPUP MODAL -->
<div class="modal fade" id="adModal" tabindex="-1" aria-hidden="true" style="backdrop-filter: blur(5px);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background: rgba(20, 20, 20, 0.95); border: 1px solid rgba(30, 215, 96, 0.3); border-radius: var(--radius);">
      <div class="modal-body text-center p-4">
        <span class="text-white" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">Advertisement</span>
        
                <!-- VIDEO AD START -->
        <video id="adVideoPlayer" src="/images/ad-video.mp4" style="width: 100%; border-radius: 10px; margin: 15px 0; pointer-events: none;" autoplay playsinline></video>
        
        <p class="text-white mb-3">Support By Spotibai! 🎧</p>
        
        <button type="button" class="btn-accent btn w-100" data-bs-dismiss="modal" id="closeAdBtn">Continue Listening</button>
      </div>
    </div>
  </div>
</div>
<!-- MODERN PLAYLIST MODAL -->
<div class="modal fade" id="playlistModal" tabindex="-1" aria-hidden="true" style="backdrop-filter: blur(5px);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background: rgba(20, 20, 20, 0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius);">
      <div class="modal-body p-4">
        <h4 class="mb-3 text-white" style="font-weight: 700;">Create Playlist</h4>
        <input type="text" id="newPlaylistName" class="form-control mb-4" placeholder="My awesome playlist..." autocomplete="off">
        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn-accent btn" id="savePlaylistBtn">Create</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
